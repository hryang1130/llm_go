# ===================== 项目全局配置 =====================
# 所有流水线阶段共享这一份配置

model:
  # 小型 LLaMA 架构 (从零训练, CPU 可跑)
  vocab_size: 2048            # BPE 词表大小
  hidden_size: 256            # 隐藏层维度
  intermediate_size: 768      # FFN 中间层维度
  num_hidden_layers: 4        # Transformer 层数
  num_attention_heads: 4      # 注意力头数
  num_key_value_heads: 2      # KV 头数 (GQA, 减小 KV 缓存)
  max_position_embeddings: 512
  rms_norm_eps: 1.0e-5

train:
  block_size: 256             # 训练序列长度
  batch_size: 8
  epochs: 150                 # 小模型需要足够轮数让输出收敛到语料分布
  learning_rate: 3.0e-4
  warmup_steps: 30
  logging_steps: 10
  seed: 42

paths:
  corpus: data/corpus.txt
  tokenizer_dir: models/tokenizer
  output_dir: models/tinyllm-hf          # 训练产物 (HF 格式)
  gguf_f16: models/tinyllm-f16.gguf      # 导出的 FP16 GGUF
  gguf_q4: models/tinyllm-q4_k_m.gguf    # 量化后的 GGUF

quantize:
  type: Q4_K_M                # llama.cpp 量化方案

serve:
  llama_server_url: http://127.0.0.1:8081   # llama.cpp server 地址
  gateway_port: 8080                        # Go 网关监听端口
  default_max_tokens: 256
  default_temperature: 0.8
